
<div class="form-container">

  <div class="form-header">
    <h2>Edit Project</h2>
    <p>Update the project information below.</p>
  </div>

  <div class="message success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="updateProject()" #projectForm="ngForm">

    <div class="form-group">
      <label>Project Name *</label>
      <input
        type="text"
        name="projectName"
        [(ngModel)]="project.projectName"
        placeholder="Enter project name"
        required
        maxlength="150">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        name="description"
        [(ngModel)]="project.description"
        placeholder="Enter project description"
        rows="4">
      </textarea>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Start Date</label>
        <input
          type="date"
          name="startDate"
          [(ngModel)]="project.startDate">
      </div>

      <div class="form-group">
        <label>End Date</label>
        <input
          type="date"
          name="endDate"
          [(ngModel)]="project.endDate">
      </div>

    </div>

    <div class="form-group">
      <label>Project Status *</label>

      <select
        name="status"
        [(ngModel)]="project.status"
        required>

        <option value="PLANNED">Planned</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
        <option value="ON-HOLD">On Hold</option>


      </select>
    </div>

    <!-- Project Progress -->
    <div class="form-group progress-group">

      <label>Project Progress</label>

      <div class="progress-value">
        <input
          type="number"
          name="progress"
          [(ngModel)]="project.progress"
          min="0"
          max="100"
          required>

        <span>%</span>
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          [style.width.%]="project.progress ?? 0">
        </div>
      </div>

      <div class="progress-details">
        <span>Completion Progress</span>
        <strong>{{ project.progress ?? 0 }}%</strong>
      </div>

      <small>Enter progress between 0 and 100.</small>

    </div>

    <div class="form-actions">

      <button
        type="button"
        class="back-btn"
        (click)="goBack()">
        Back
      </button>

      <button
        type="submit"
        class="save-btn"
        [disabled]="projectForm.invalid">
        Update Project
      </button>

    </div>

  </form>

</div>
