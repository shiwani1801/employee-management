
<div class="add-task-container">

  <div class="page-header">
    <div>
      <h2>Add New Task</h2>
      <p>Create a task and assign it to a project and employee</p>
    </div>

    <button class="back-btn" routerLink="/tasks">
      ← Back to Tasks
    </button>
  </div>

  <div class="form-card">

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="addTask()" #taskForm="ngForm">

      <div class="form-group">
        <label>Task Title *</label>
        <input
          type="text"
          name="title"
          [(ngModel)]="task.title"
          placeholder="Enter task title"
          maxlength="150"
          required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          name="description"
          [(ngModel)]="task.description"
          placeholder="Enter task description"
          rows="4"
          maxlength="1000">
        </textarea>
      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Select Project *</label>
          <select
            name="project"
            [(ngModel)]="selectedProjectId"
            required>

            <option [ngValue]="null">Select Project</option>

            <option
              *ngFor="let project of projects"
              [ngValue]="project.id">
              {{ project.projectName }}
            </option>

          </select>
        </div>

        <div class="form-group">
          <label>Assign Employee *</label>
          <select
            name="employee"
            [(ngModel)]="selectedEmployeeId"
            required>

            <option [ngValue]="null">Select Employee</option>

            <option
              *ngFor="let employee of employees"
              [ngValue]="employee.id">
              {{ employee.fullName }}
            </option>

          </select>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Start Date *</label>
          <input
            type="date"
            name="startDate"
            [(ngModel)]="task.startDate"
            required>
        </div>

        <div class="form-group">
          <label>Deadline *</label>
          <input
            type="date"
            name="deadline"
            [(ngModel)]="task.deadline"
            [min]="task.startDate || null"
            required>
        </div>

      </div>

      <div class="form-group">
        <label>Task Status *</label>

        <select
          name="status"
          [(ngModel)]="task.status"
          required>

          <option value="PENDING">Pending</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="COMPLETED">Completed</option>

        </select>
      </div>

      <div class="form-actions">

        <button
          type="submit"
          class="submit-btn"
          [disabled]="loading || taskForm.invalid">

          {{ loading ? 'Saving...' : 'Create Task' }}

        </button>

        <button
          type="button"
          class="cancel-btn"
          routerLink="/tasks">
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>
